# Production Environment Configuration
# Usage: APP_ENV=production cargo run

host = "0.0.0.0"
port = 8080

[database]
url = "postgresql://prod_user:secure_password@prod-db.example.com:5432/prod_db"

[redis]
url = "redis://prod-redis.example.com:6379/0"

[tracing]
# Log level: trace, debug, info, warn, error
level = "info"
# Log format: pretty (colored console), json (structured)
format = "json"
# Output destinations: console, file
output = ["console", "file"]
# Log file path (relative to project root)
file_path = "logs"
# Log rotation in days
rotation_days = 7
# OpenTelemetry OTLP endpoint (optional)
# Set via environment variable: OTEL_EXPORTER_OTLP_ENDPOINT
# Recommended for production: configure via environment variable
# otlp_endpoint = "http://otel-collector:4317"

# Service metadata (optional, can be set via environment variables)
# OTEL_SERVICE_NAME = "rust_axum_prod"
# OTEL_SERVICE_VERSION = "0.1.0"
